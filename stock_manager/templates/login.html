<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – StockFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sf-primary: #4f46e5;
            --sf-primary-hover: #4338ca;
            --sf-bg: #f8fafc;
            --sf-card: #ffffff;
            --sf-border: #e2e8f0;
            --sf-text: #1e293b;
            --sf-muted: #64748b;
        }
        body.dark-mode {
            --sf-bg: #0f172a;
            --sf-card: #1e293b;
            --sf-border: #334155;
            --sf-text: #f8fafc;
            --sf-muted: #94a3b8;
        }
        * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
        body {
            background: var(--sf-bg);
            color: var(--sf-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--sf-card);
            border: 1px solid var(--sf-border);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }
        .brand-badge {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--sf-primary), #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: #fff;
            margin: 0 auto 1.25rem;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
        }
        .login-btn {
            background: var(--sf-primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: .75rem 1rem;
            font-weight: 600;
            font-size: .95rem;
            width: 100%;
            transition: all .2s;
        }
        .login-btn:hover {
            background: var(--sf-primary-hover);
            color: #fff;
        }
        .form-control {
            border-radius: 10px;
            padding: .7rem .9rem;
            font-size: .92rem;
            border-color: var(--sf-border);
        }
        .form-control:focus {
            border-color: var(--sf-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        .sf-flash {
            border-radius: 10px;
            padding: .75rem 1rem;
            margin-bottom: 1.25rem;
            font-size: .88rem;
            display: flex;
            align-items: center;
            gap: .5rem;
            background: #ede9fe;
            color: var(--sf-primary);
            border: 1px solid #c4b5fd;
        }
        .sf-flash.danger {
            background: #fee2e2;
            color: #991b1b;
            border-color: #fca5a5;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-badge">
            <i class="bi bi-box-seam"></i>
        </div>
        <div class="text-center mb-4">
            <h3 class="fw-bold mb-1">StockFlow</h3>
            <p class="text-muted small">Sign in to manage inventory & invoices</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, msg in messages %}
                    <div class="sf-flash {% if category == 'danger' %}danger{% endif %}">
                        <i class="bi {% if category == 'danger' %}bi-exclamation-octagon-fill{% else %}bi-info-circle-fill{% endif %}"></i>
                        {{ msg }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="login-btn mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
        </form>

        <div class="text-center pt-2">
            <small class="text-muted">StockFlow v2.0 &bull; Default admin: <code>admin</code> / <code>admin123</code></small>
        </div>
    </div>
</body>
</html>
